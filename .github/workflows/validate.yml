name: HACS Validate

# Run after publishing assets, or on demand; no daily idle runs.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands
          comment: false
